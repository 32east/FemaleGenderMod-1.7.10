// Extra build configuration on top of the GTNH convention.

// `./gradlew runClient -Pautotest` boots a flat world, poses the player, writes
// screenshots into run/client/screenshots and quits. See com.wildfire.debug.AutoTest.
tasks.configureEach { task ->
    if (task.name.startsWith('runClient') && task instanceof JavaExec) {
        if (project.hasProperty('autotest')) {
            task.jvmArgs '-Dfemalegender.autotest=true'
        }
    }
}

// `./gradlew installMod` drops the freshly reobfuscated jar into the GT New Horizons mods folder,
// under a fixed name, so a stale build can never be picked up by mistake.
def packMods = file(System.getenv('FGM_PACK_MODS')
    ?: "${System.getProperty('user.home')}/AppData/Roaming/.tlauncher/legacy/Minecraft/game/mods")

tasks.register('installMod', Copy) {
    group = 'femalegender'
    description = 'Copy the built mod into the modpack mods folder'
    dependsOn tasks.named('reobfJar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into packMods
    rename { 'femalegender.jar' }
    doLast {
        logger.lifecycle("installed ${packMods}/femalegender.jar")
    }
}
